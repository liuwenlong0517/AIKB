[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aikb-web"
version = "0.1.0"
description = "AIKB local read-only knowledge management WebUI"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "pydantic>=2.10,<3",
  "uvicorn>=0.34,<1",
]

[project.optional-dependencies]
test = ["httpx>=0.27,<1"]

[project.scripts]
aikb-web = "aikb_web.__main__:main"

[tool.setuptools.packages.find]
where = ["backend"]
include = ["aikb_web*"]
